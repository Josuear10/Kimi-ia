<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kimi</title>
  <style>
    :root {
      --bg-app: #f7f7f8;
      --bg-sidebar: #f0f0f2;
      --bg-main: #ffffff;
      --bg-active: #ffffff;
      --text-primary: #1c1c1e;
      --text-secondary: #6b6b70;
      --text-muted: #9b9ba1;
      --border: #e8e8ec;
      --pink-50: #fdf2f8;
      --pink-100: #fce7f3;
      --pink-200: #fbcfe8;
      --pink-300: #f9a8d4;
      --pink-400: #f472b6;
      --pink-accent: #ec4899;
      --pink-soft: #fff5fa;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 999px;
      --sidebar-width: 248px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.25rem 0.875rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 0.5rem 1.25rem;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--pink-200), var(--pink-300));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--pink-accent);
      font-size: 0.85rem;
      font-weight: 800;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      color: var(--text-secondary);
      text-decoration: none;
      border: none;
      background: transparent;
      cursor: pointer;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      stroke: currentColor;
    }

    .nav-item.active {
      background: var(--bg-active);
      color: var(--text-primary);
      font-weight: 500;
      box-shadow: var(--shadow-sm);
    }

    .nav-item.active svg {
      stroke: var(--pink-accent);
    }

    .nav-section {
      margin-top: 1.5rem;
    }

    .nav-section-label {
      padding: 0 0.75rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .sidebar-spacer {
      flex: 1;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.65rem 0.75rem;
      border-radius: var(--radius-sm);
      background: var(--bg-active);
      border: 1px solid var(--border);
    }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink-100), var(--pink-200));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--pink-accent);
      flex-shrink: 0;
    }

    .user-info {
      min-width: 0;
    }

    .user-name {
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-role {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
      min-width: 0;
      position: relative;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 2rem 7rem;
      overflow-y: auto;
    }

    .main-content.has-chat {
      justify-content: flex-start;
      padding-top: 2.5rem;
    }

    /* Welcome */
    .welcome {
      text-align: center;
      max-width: 680px;
      width: 100%;
    }

    .welcome.hidden {
      display: none;
    }

    .welcome h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .welcome h1 span {
      color: var(--pink-accent);
    }

    .welcome p {
      margin: 0 auto 2rem;
      max-width: 520px;
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      max-width: 640px;
      margin: 0 auto;
    }

    .suggestion {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.55rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--bg-main);
      font-size: 0.82rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      font-family: inherit;
    }

    .suggestion svg {
      width: 15px;
      height: 15px;
      stroke: var(--pink-400);
      flex-shrink: 0;
    }

    .suggestion:hover {
      border-color: var(--pink-200);
      background: var(--pink-soft);
      color: var(--text-primary);
    }

    /* Chat area */
    #chat-area {
      width: 100%;
      max-width: 720px;
    }

    #chat-area.hidden {
      display: none;
    }

    .exchange {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .message {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .message.user .message-avatar {
      background: var(--bg-sidebar);
      color: var(--text-secondary);
    }

    .message.assistant .message-avatar {
      background: linear-gradient(135deg, var(--pink-100), var(--pink-200));
      color: var(--pink-accent);
    }

    .message-body {
      flex: 1;
      min-width: 0;
    }

    .message-label {
      margin: 0 0 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .message.assistant .message-label {
      color: var(--pink-accent);
    }

    .message-text {
      margin: 0;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-primary);
      line-height: 1.65;
    }

    .message.user .message-text {
      color: var(--text-secondary);
    }

    .status-card {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .status-card.loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .status-card.error {
      color: #be123c;
      background: var(--pink-50);
      border: 1px solid var(--pink-200);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
    }

    .dots {
      display: inline-flex;
      gap: 4px;
    }

    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pink-300);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* Input bar */
    .input-wrapper {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem 2rem 1.25rem;
      background: linear-gradient(to top, var(--bg-main) 70%, transparent);
    }

    .input-bar {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.5rem 0.5rem 1rem;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-bar:focus-within {
      border-color: var(--pink-200);
      box-shadow: 0 2px 16px rgba(236, 72, 153, 0.08);
    }

    .input-icon {
      flex-shrink: 0;
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }

    .input-icon svg {
      width: 18px;
      height: 18px;
      stroke: var(--pink-300);
    }

    #prompt {
      flex: 1;
      border: none;
      outline: none;
      font: inherit;
      font-size: 0.9rem;
      color: var(--text-primary);
      background: transparent;
      resize: none;
      min-height: 24px;
      max-height: 120px;
      line-height: 1.5;
      padding: 0.35rem 0;
    }

    #prompt::placeholder {
      color: var(--text-muted);
    }

    #prompt:disabled {
      opacity: 0.6;
    }

    #submit-btn {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: var(--pink-100);
      color: var(--pink-accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }

    #submit-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    #submit-btn:hover:not(:disabled) {
      background: var(--pink-200);
    }

    #submit-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    #submit-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .input-footer {
      text-align: center;
      margin-top: 0.5rem;
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .main-content {
        padding: 1.5rem 1rem 6.5rem;
      }

      .input-wrapper {
        padding: 0.75rem 1rem 1rem;
      }

      .suggestions {
        gap: 0.5rem;
      }

      .suggestion {
        font-size: 0.78rem;
        padding: 0.5rem 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">K</div>
        Kimi
      </div>

      <nav class="nav">
        <button type="button" class="nav-item active" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          Preguntar
        </button>
      </nav>

      <div class="nav-section">
        <p class="nav-section-label">Ayuda</p>
        <nav class="nav">
          <button type="button" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            Ayuda
          </button>
          <button type="button" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            Contáctanos
          </button>
        </nav>
      </div>

      <div class="sidebar-spacer"></div>

      <div class="user-card">
        <div class="user-avatar">Tú</div>
        <div class="user-info">
          <div class="user-name">Usuario</div>
          <div class="user-role">Asistente Kimi</div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="main-content" id="main-content">
        <section class="welcome" id="welcome">
          <h1>Bienvenido a <span>Kimi</span></h1>
          <p>
            Explora las sugerencias o escribe tu consulta en la barra inferior.
            Kimi te responderá de forma clara y directa.
          </p>
          <div class="suggestions" id="suggestions">
            <button type="button" class="suggestion" data-prompt="Explícame un concepto difícil de forma sencilla">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
              </svg>
              Aprendizaje
            </button>
            <button type="button" class="suggestion" data-prompt="Dame ideas creativas para un proyecto personal">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
              Ideas
            </button>
            <button type="button" class="suggestion" data-prompt="Resume un texto largo en puntos clave">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
              </svg>
              Resúmenes
            </button>
            <button type="button" class="suggestion" data-prompt="Ayúdame a redactar un mensaje profesional y amable">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Redacción
            </button>
            <button type="button" class="suggestion" data-prompt="Dame consejos prácticos para organizar mi día">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              Productividad
            </button>
            <button type="button" class="suggestion" data-prompt="Explícame paso a paso cómo resolver un problema">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
              </svg>
              Soluciones
            </button>
          </div>
        </section>

        <div id="chat-area" class="hidden" aria-live="polite"></div>
      </div>

      <div class="input-wrapper">
        <form id="chat-form" class="input-bar">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </span>
          <textarea
            id="prompt"
            name="prompt"
            rows="1"
            placeholder="Escribe tu mensaje aquí…"
            required
          ></textarea>
          <button type="submit" id="submit-btn" aria-label="Enviar">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </form>
        <p class="input-footer">Kimi</p>
      </div>
    </main>
  </div>

  <script>
    const form = document.getElementById("chat-form");
    const promptInput = document.getElementById("prompt");
    const submitBtn = document.getElementById("submit-btn");
    const chatArea = document.getElementById("chat-area");
    const welcome = document.getElementById("welcome");
    const mainContent = document.getElementById("main-content");
    const suggestions = document.getElementById("suggestions");

    promptInput.addEventListener("input", () => {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 120) + "px";
    });

    promptInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      promptInput.disabled = isLoading;
    }

    function showChatView() {
      welcome.classList.add("hidden");
      mainContent.classList.add("has-chat");
      chatArea.classList.remove("hidden");
    }

    function showWelcomeView() {
      welcome.classList.remove("hidden");
      mainContent.classList.remove("has-chat");
      chatArea.classList.add("hidden");
      chatArea.innerHTML = "";
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function renderLoading() {
      return `
        <div class="status-card loading">
          <span>Kimi está pensando</span>
          <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </div>
      `;
    }

    function renderExchange(question, answer) {
      return `
        <div class="exchange">
          <div class="message user">
            <div class="message-avatar">Tú</div>
            <div class="message-body">
              <p class="message-label">Tu consulta</p>
              <p class="message-text">${escapeHtml(question)}</p>
            </div>
          </div>
          <div class="message assistant">
            <div class="message-avatar">K</div>
            <div class="message-body">
              <p class="message-label">Kimi</p>
              <p class="message-text">${escapeHtml(answer)}</p>
            </div>
          </div>
        </div>
      `;
    }

    function renderError(message) {
      return `<div class="status-card error">${escapeHtml(message)}</div>`;
    }

    async function sendPrompt(prompt) {
      const trimmed = prompt.trim();
      if (!trimmed) return;

      showChatView();
      chatArea.innerHTML = renderLoading();
      setLoading(true);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: trimmed }),
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          const message =
            typeof data.detail === "string"
              ? data.detail
              : data.detail?.message || data.message || `Error del servidor (${response.status})`;
          chatArea.innerHTML = renderError(message);
          return;
        }

        if (!data.response) {
          chatArea.innerHTML = renderError("La respuesta del servidor no incluye texto.");
          return;
        }

        chatArea.innerHTML = renderExchange(trimmed, data.response);
      } catch (err) {
        const message =
          err instanceof TypeError && err.message.includes("fetch")
            ? "No se pudo conectar con el servidor. Comprueba que la aplicación esté en ejecución."
            : "Ocurrió un error inesperado. Inténtalo de nuevo.";
        chatArea.innerHTML = renderError(message);
      } finally {
        setLoading(false);
        promptInput.style.height = "auto";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const prompt = promptInput.value;
      promptInput.value = "";
      promptInput.style.height = "auto";
      await sendPrompt(prompt);
    });

    suggestions.addEventListener("click", (event) => {
      const button = event.target.closest(".suggestion");
      if (!button) return;
      const prompt = button.dataset.prompt;
      promptInput.value = prompt;
      promptInput.dispatchEvent(new Event("input"));
      promptInput.focus();
    });
  </script>
</body>
</html>
